# Contacto-Cliente — intermediario en Cloudflare Workers
# Se publica solo con GitHub Actions (.github/workflows/worker.yml). Ver docs/instalacion-cloudflare.md

name = "contacto-cliente"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Datos de la app registrada en Microsoft Entra ID (no son secretos)
MS_TENANT_ID = "8dbe3e04-118c-4cd5-ae67-0c0c21606098"
MS_CLIENT_ID = "517c99df-427c-467b-9bf7-c4c8ca0b8399"
# Recibe los avisos de cambios de contraseña y los códigos de recuperación
CORREO_GENERAL = "christian.lino@planetaazulrd.com"
# Páginas que pueden usar la API, separadas por coma (ej. "https://usuario.github.io"). "*" = cualquiera.
ORIGENES_PERMITIDOS = "https://fmartinez-world.github.io/contacto-cliente/"

# Secretos (NO van aquí; se cargan desde los secretos de GitHub al publicar):
#   MS_CLIENT_SECRET     valor del secreto de la app de Microsoft
#   CLAVE_CONFIGURACION  clave para entrar a /configurar (mínimo 12 caracteres)

[[durable_objects.bindings]]
name = "CC"
class_name = "ContactoCliente"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ContactoCliente"]

[observability]
enabled = true
